[package]
name = "scene-pane"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "A scenegraph scene as one rect on a macroquad-gamekit stage: draw, pick, project, report"

# Runtime edge crate: macroquad + the gamekit's report. The document, the
# poses and the rules stay in the pure crates below it.

[dependencies]
scenegraph = { workspace = true }
scenegraph-mq = { workspace = true }
sceneinput = { workspace = true }
macroquad = "0.4"
macroquad-gamekit = { path = "../../gaming/macroquad-gamekit" }
