<!DOCTYPE html>
<!--
  THE macroquad web shell, rendered for every bundle `macroquad-bundle` makes
  (shared-crates/ui/macroquad-bundle). Moved here from augminted-bots'
  scripts/macroquad-shell.html so every repo's pages share it.

  Generated from, not edited into place: edit this; never edit a rendered
  copy under a `dist/`, `web/` or `static/` directory. A bundle that needs a
  different page passes `--shell <file>` with the same tokens.

  Tokens:
    __TITLE__    document title (HTML-escaped)
    __SCRIPTS__  the <script src> tag for `runtime.<hash>.js`, which runs gl.js,
                 sapp_jsutils.js, quad-net.js when imported, then the crate's
                 own plugins, in that order
    __WASM__     wasm path, with its cache-busting query already appended
    __MANIFEST__ (optional) the <link rel="manifest"> for the bundle's
                 manifest.webmanifest, which makes a home-screen launch
                 fullscreen
    __HEAD__     (optional) the page's social card: the description, Open
                 Graph and Twitter tags a shared link is previewed from, from
                 the crate's [package.metadata.mq-bundle]. Empty without one.

  Everything here was learned the hard way in an embedded iframe. Before
  removing any of it, read the comment saying why it exists.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>__TITLE__</title>
  <!-- `viewport-fit=cover`: a wallet's in-app browser on iOS otherwise letterboxes
       the canvas inside the safe area. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Fullscreen from a home-screen icon. An iPhone's Safari has no element
       fullscreen at all (only video gets it), so a game added to the home
       screen is how it fills an iPhone: these tags and the manifest make it
       launch without the browser's bars. Android reads the manifest too. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__TITLE__">
  <meta name="theme-color" content="#050510">
__MANIFEST__
__HEAD__
  <style>
    /* Reset + viewport-fill — macroquad's recommended shell. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }

    /* The canvas takes the whole iframe. Discord sizes the iframe; the conf
       framebuffer is scaled by the browser to fit.

       Without the width/height rules the canvas renders at its intrinsic
       framebuffer size and sits centred in whatever space it was given — a
       small picture marooned in a large black rectangle. `touch-action: none`
       stops the browser treating a drag on the canvas as a scroll or a
       double-tap as a zoom, which on mobile eats the input the game wanted. */
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

    /* Boot status. Shown until load() is called, and again — permanently —
       if the runtime cannot come up, so a failed boot says why instead of
       leaving a black rectangle. */
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      background: #050510; color: #8b93a1;
      font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
      z-index: 1000; pointer-events: none;
    }
    #boot.hidden { display: none; }

    /* A failure is for the person holding the phone, not for devtools: what
       happened in a sentence, one way out (Reload), and the raw text folded
       away underneath for a screenshot to carry to us. `pointer-events` is
       back on so the button can be pressed; the canvas behind is dead anyway. */
    #boot.failed { pointer-events: auto; overflow-y: auto; align-items: flex-start; }
    #boot .card {
      margin: max(48px, env(safe-area-inset-top)) auto 24px; max-width: 420px; width: 100%;
      padding: 24px; border: 1px solid #2a2f3a; border-radius: 12px; background: #0b0d18;
      color: #d7dbe3; text-align: left;
    }
    #boot h1 { font-size: 18px; margin-bottom: 8px; color: #fb7185; }
    #boot p { margin-bottom: 20px; }
    #boot button {
      display: block; width: 100%; min-height: 48px; border: 0; border-radius: 8px;
      background: #f2c14e; color: #050510; font: inherit; font-size: 16px; font-weight: 600;
      cursor: pointer;
    }
    #boot button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
    #boot details { margin-top: 20px; color: #8b93a1; }
    #boot summary { cursor: pointer; min-height: 32px; }
    #boot pre {
      margin-top: 8px; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="boot" role="status">loading…</div>
  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#d7dbe3;font-family:system-ui,sans-serif;background:#050510;z-index:1001">
      This app needs JavaScript turned on.
    </div>
  </noscript>
  <canvas id="glcanvas" tabindex="1"></canvas>

  <script>
    // The failure card. One place draws it, whatever failed: no WebGL, a bad
    // boot, a Rust panic, a lost GL context. `__mq_fail` takes a title, a
    // sentence and optional raw details, and replaces whatever the panel showed;
    // the first failure's details are the useful ones, so a later one keeps them.
    //
    // A page that has died is a page someone is stuck on, usually on a phone
    // with no devtools: say so plainly, offer Reload (the app restores its
    // session from storage), and keep the raw lines for a screenshot.
    (function () {
      var shown = null;
      window.__mq_fail = function (title, text, details) {
        var boot = document.getElementById("boot");
        if (shown) details = details ? shown + "\n\nthen: " + details : shown;
        shown = details || null;
        boot.className = "failed";
        boot.setAttribute("role", "alert");
        boot.textContent = "";
        var card = document.createElement("div");
        card.className = "card";
        var h = document.createElement("h1");
        h.textContent = title;
        var p = document.createElement("p");
        p.textContent = text;
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = "Reload";
        button.addEventListener("click", function () { window.location.reload(); });
        card.appendChild(h);
        card.appendChild(p);
        card.appendChild(button);
        if (details) {
          var more = document.createElement("details");
          var summary = document.createElement("summary");
          summary.textContent = "Details for a bug report";
          var pre = document.createElement("pre");
          pre.textContent = details;
          more.appendChild(summary);
          more.appendChild(pre);
          card.appendChild(more);
        }
        boot.appendChild(card);
        button.focus();
      };
    })();
  </script>

  <script>
    // Acquire the WebGL context BEFORE gl.js loads, and say so if it fails.
    //
    // miniquad's gl.js does a bare `canvas.getContext("webgl")` with no
    // options and no null-check, then dereferences the result — so a context
    // the embedder declines is an uncaught TypeError at boot and the canvas
    // stays background-coloured forever. That is exactly "black screen".
    //
    // A canvas returns its existing context on later getContext calls of the
    // same type, so creating it here with embed-friendly options is what
    // gl.js then receives. If even this fails, the boot panel says why.
    (function () {
      var canvas = document.getElementById("glcanvas");
      var opts = {
        // Discord's iframe may run on integrated/software GL; don't demand
        // the discrete GPU or fail-on-low-perf.
        powerPreference: "default",
        failIfMajorPerformanceCaveat: false,
        // Not needed for a game loop that redraws every frame, and off is
        // the cheaper default in most embedders.
        preserveDrawingBuffer: false,
        alpha: false,
        antialias: true,
      };
      var gl = canvas.getContext("webgl", opts) || canvas.getContext("experimental-webgl", opts);
      if (!gl) {
        window.__mq_fail(
          "This browser can't draw the app",
          "It needs WebGL, which is turned off or unavailable here. Try opening the link in " +
            "your phone's main browser (Chrome or Safari).",
          "WebGL context unavailable · " + navigator.userAgent
        );
        console.error("shell: WebGL context unavailable");
        window.__mq_no_gl = true;
        return;
      }

      // A phone may throw away a backgrounded tab's GL context, and the wallet
      // handoff sends people to another app and back. miniquad cannot rebuild
      // its textures and buffers on a new context, so a lost one is a dead
      // canvas: reload. Lost while hidden, the reload happens on return, once
      // per half-minute so a context that keeps dying cannot loop the page.
      var lostWhileHidden = false;
      var reloadOnce = function () {
        // Storage can be refused in a sandboxed frame; then never auto-reload.
        try {
          var key = "mq_context_reload";
          var last = Number(sessionStorage.getItem(key) || 0);
          if (Date.now() - last < 30000) return false;
          sessionStorage.setItem(key, String(Date.now()));
        } catch (err) {
          return false;
        }
        window.location.reload();
        return true;
      };
      canvas.addEventListener("webglcontextlost", function (e) {
        // Asking to restore is harmless; miniquad cannot use it, the reload can.
        e.preventDefault();
        console.warn("shell: WebGL context lost");
        if (document.hidden) {
          lostWhileHidden = true;
        } else if (!reloadOnce()) {
          window.__mq_fail(
            "The display was reset",
            "Your browser reset the app's graphics. Reload to carry on.",
            "webglcontextlost while visible"
          );
        }
      });
      document.addEventListener("visibilitychange", function () {
        if (document.hidden || !lostWhileHidden) return;
        lostWhileHidden = false;
        if (!reloadOnce()) {
          window.__mq_fail(
            "The display was reset",
            "Your browser reset the app's graphics while it was in the background. " +
              "Reload to carry on.",
            "webglcontextlost while hidden"
          );
        }
      });
    })();
  </script>

  <!--
    Script load order, per miniquad + sapp_jsutils conventions:
      1. gl.js            — defines load() + miniquad_add_plugin
      2. sapp_jsutils.js  — defines js_object() / consume_js_object()
      3. plugins          — quad-net, then each crate's own (stamped by build.rs)
      4. load(<wasm>)     — instantiate

    1–3 arrive as ONE tag, `runtime.<hash>.js`, named by its content: it runs
    each script as its own <script>, in this order (macroquad-bundle's
    runtime.rs). A new build is a new name, so a cached script never meets
    another build's wasm; only this page must be fetched fresh.

    Paths are relative unless the bundle was made with `--base`: Discord's
    proxy serves a bundle at its mapped path, so `gl.js` resolves beside the
    page without the app knowing its own subpath. A page served at a bare path
    with no trailing slash (`/pump`) resolves relative paths against the
    parent, so it needs `--base /pump/`.
  -->
__SCRIPTS__
  <script>
    // Surface Rust panics on the canvas.
    //
    // The release profile is `panic = "abort"`, so a Rust panic reaches JS
    // only as `RuntimeError: unreachable` — no message, no location. But
    // miniquad installs a panic hook that writes the FULL PanicInfo (message,
    // file, line) to `console_log` *before* the abort. In a browser tab that's
    // devtools; in Discord's iframe there is no devtools. So: mirror any
    // console line that looks like a panic onto the boot panel, where the
    // `unreachable` handler below would otherwise land with nothing to say.
    //
    // Kept as a ring of the last few lines, because the panic message is
    // sometimes preceded by the useful context (which command, which poll).
    (function () {
      var recent = [];
      var showPanel = function (text) {
        window.__mq_fail(
          "Something went wrong",
          "The app hit an error and stopped. Reloading usually fixes it. If it keeps " +
            "happening, a screenshot of the details below helps us find it.",
          text
        );
      };
      var wrap = function (name) {
        var orig = console[name].bind(console);
        console[name] = function () {
          var line = Array.prototype.map.call(arguments, function (a) {
            return typeof a === "string" ? a : (a && a.message) || String(a);
          }).join(" ");
          recent.push(line);
          if (recent.length > 8) recent.shift();
          // miniquad formats the hook as `PanicInfo { ... }` / `panicked at`;
          // Rust's default hook says `panicked at`. Either is the signal.
          if (!window.__mq_panic && /panicked at|PanicInfo|PanicHookInfo/.test(line)) {
            window.__mq_panic = line;
            showPanel("rust panic:\n\n" + recent.join("\n"));
          }
          orig.apply(console, arguments);
        };
      };
      ["log", "warn", "error"].forEach(wrap);
      window.__mq_recent_console = recent;
    })();

    if (!window.__mq_no_gl) {
      document.getElementById("boot").classList.add("hidden");
      // Surface a failed instantiate on the boot panel too — otherwise a
      // missing import or a bad wasm is only visible in devtools, which an
      // embedded iframe doesn't readily offer.
      // Either kind of uncaught error is treated as fatal: one thrown through
      // the wasm leaves miniquad's event handler borrowed, so every later event
      // fails too, and a page that looks alive but ignores taps is worse than
      // one that says it stopped.
      var fatal = function (what) {
        // A panic already wrote its message; `unreachable` is just the abort
        // that follows it, and would bury the useful line under a useless one.
        if (window.__mq_panic) return;
        var tail = (window.__mq_recent_console || []).slice(-4).join("\n");
        window.__mq_fail(
          "Something went wrong",
          "The app hit an error and stopped. Reloading usually fixes it. If it keeps " +
            "happening, a screenshot of the details below helps us find it.",
          "error: " + what + (tail ? "\n\nlast console lines:\n" + tail : "")
        );
      };
      window.addEventListener("error", function (e) {
        // A failed <img> or <script> load bubbles here too, with no message;
        // that is not the app stopping.
        if (e.target && e.target !== window) return;
        fatal(e.message || (e.error && e.error.message) || "unknown");
      });
      window.addEventListener("unhandledrejection", function (e) {
        fatal(e.reason && e.reason.message ? e.reason.message : String(e.reason));
      });
      load("__WASM__");
    }
  </script>
</body>
</html>
