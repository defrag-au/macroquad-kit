[package]
name = "jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The container-flow job artefacts, read into one typed board. No renderer, no
# macroquad, no network: a job directory in, `Job` values out.
#
# See `agent-playbook/docs/design/container-flows.md` for the contract these
# files come from.

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
